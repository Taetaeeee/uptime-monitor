<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <!-- 테마를 화면을 그리기 전에 정함 (깜빡임 방지). ?theme=light|dark가 있으면 그것을, 없으면 이 브라우저에 저장된 값을 씀. 기본은 어두운 화면 -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get('theme');
        var t = q === 'light' || q === 'dark' ? q : localStorage.getItem('um-theme');
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    })();
  </script>
  <title>장애 보고서 · Uptime Monitor</title>
  <meta name="description" content="가상 회사의 장애 1건 상세와 사후 보고서 (포트폴리오 프로젝트)">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 주소: /incident.html?id=장애번호  → incident.js가 /api/incidents/:id 를 불러와 채웁니다 -->
  <div class="glow glow--1" aria-hidden="true"></div>
  <div class="glow glow--2" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap topbar__in">
      <a class="brand" href="/">
        <span class="brand__logo" data-icon="activity"></span>
        <span>
          <span class="brand__name">Uptime Monitor</span>
          <span class="brand__sub">Incident Report</span>
        </span>
      </a>
      <nav class="topnav" aria-label="주요 링크">
        <a href="/report.html" class="is-primary"><span data-icon="report" data-icon-class="ico ico--sm"></span><span class="label">월간 보고서</span></a>
        <a href="https://github.com/Taetaeeee/uptime-monitor" rel="noopener"><span data-icon="github" data-icon-class="ico ico--sm"></span><span class="label">GitHub</span></a>
        <!-- 화면 테마 토글 (어두운 ↔ 밝은). 동작은 common.js -->
        <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="밝은 화면">
          <span class="theme-switch__track" aria-hidden="true">
            <span class="theme-switch__icon theme-switch__icon--moon" data-icon="moon" data-icon-class="ico ico--xs"></span>
            <span class="theme-switch__icon theme-switch__icon--sun" data-icon="sun" data-icon-class="ico ico--xs"></span>
            <span class="theme-switch__thumb"></span>
          </span>
        </button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <a class="back" href="/"><span data-icon="arrowLeft" data-icon-class="ico ico--sm"></span>서비스 상태로</a>
      <h1 class="page-title" id="title">장애 보고서</h1>
      <p class="page-sub" id="subtitle">불러오는 중…</p>
    </div>

    <section class="panel" aria-labelledby="metrics-title">
      <div class="panel__head"><h2 class="panel__title" id="metrics-title"><span data-icon="chart" data-icon-class="ico ico--sm"></span>요약 지표</h2></div>
      <dl id="metrics" class="metrics"></dl>
    </section>

    <section class="panel" aria-labelledby="timeline-title">
      <div class="panel__head"><h2 class="panel__title" id="timeline-title"><span data-icon="clock" data-icon-class="ico ico--sm"></span>타임라인</h2></div>
      <ol id="timeline" class="notes"></ol>
    </section>

    <section class="panel" aria-labelledby="report-title">
      <div class="panel__head"><h2 class="panel__title" id="report-title"><span data-icon="report" data-icon-class="ico ico--sm"></span>사후 보고서</h2></div>
      <div id="report"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        <span class="badge badge--demo">데모 데이터</span>
        <span class="badge badge--sim">시뮬레이터</span>
        표시가 붙은 장애는 시연용 가짜 데이터입니다. 서비스·회사 이름은 모두 가상입니다.
      </p>
    </div>
  </footer>

  <script src="/common.js" defer></script>
  <script src="/incident.js" defer></script>
</body>
</html>
