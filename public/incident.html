<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>장애 보고서 · ○○산업 서비스 상태</title>
  <meta name="description" content="가상 회사 ○○산업의 장애 1건 상세와 사후 보고서 (포트폴리오 프로젝트)">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- 주소: /incident.html?id=장애번호  → incident.js가 /api/incidents/:id 를 불러와 채웁니다 -->
  <header class="site-header">
    <div class="wrap">
      <p class="back"><a href="/">← 서비스 상태로</a></p>
      <h1 id="title">장애 보고서</h1>
      <p id="subtitle" class="subtitle">불러오는 중…</p>
    </div>
  </header>

  <main class="wrap">
    <section aria-labelledby="metrics-title">
      <h2 id="metrics-title">요약 지표</h2>
      <dl id="metrics" class="metrics"></dl>
    </section>

    <section aria-labelledby="timeline-title">
      <h2 id="timeline-title">타임라인</h2>
      <ol id="timeline" class="notes"></ol>
    </section>

    <section aria-labelledby="report-title">
      <h2 id="report-title">사후 보고서</h2>
      <div id="report" class="report"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>
        <span class="badge badge--demo">데모 데이터</span>
        <span class="badge badge--sim">시뮬레이터</span>
        표시가 붙은 장애는 시연용 가짜 데이터입니다. ○○산업은 가상의 회사입니다.
      </p>
    </div>
  </footer>

  <script src="/common.js" defer></script>
  <script src="/incident.js" defer></script>
</body>
</html>
